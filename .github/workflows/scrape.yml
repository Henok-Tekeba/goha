name: Daily Scrape

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - run: npm ci
        working-directory: scraper

      - name: Scraper HTTP-bound regression tests
        run: npm test
        working-directory: scraper

      - run: npm start
        working-directory: scraper
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Regenerate frontend fixtures (data/*.json → data/*.mock.*)
        run: node scripts/build-goha-fixtures.mjs

      - run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "tekebahenok6@gmail.com"
          git add data/ public/data/ public/langs/ public/types/
          git diff --quiet && git diff --staged --quiet || git commit -m "daily scrape $(date +%Y-%m-%d)"
          git push

      - name: Open issue for disappeared records
        run: node scripts/open-project-diff-issue.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
